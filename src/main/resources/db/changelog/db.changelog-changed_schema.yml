databaseChangeLog:
  - logicalFilePath: migrations/000_legacy_migrations.yaml
  - changeSet:

      id: 8a-update-denomination-constraint
      author: Luka Buziu
      preConditions:
        onFail: MARK_RAN
        # If a CHECK that already includes 200 exists, skip (MARK_RAN)
        sqlCheck:
          expectedResult: 0
          sql: select 1

      changes:
        # 1) Drop any existing CHECK constraint(s) on column 'denomination' (unknown names)
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              DECLARE r RECORD;
              BEGIN
                FOR r IN
                  SELECT c.conname
                  FROM pg_constraint c
                  JOIN pg_attribute a
                    ON a.attrelid = c.conrelid
                   AND a.attnum  = ANY (c.conkey)
                 WHERE c.conrelid = 'public.change_reserve_log'::regclass
                   AND c.contype  = 'c'
                   AND a.attname  = 'denomination'
                LOOP
                  EXECUTE format(
                    'ALTER TABLE public.change_reserve_log DROP CONSTRAINT IF EXISTS %I',
                    r.conname
                  );
                END LOOP;
              END $$;

        # 2) Add our new deterministic CHECK constraint (with 200)
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              ALTER TABLE public.change_reserve_log
              ADD CONSTRAINT chk_change_reserve_log_denomination
              CHECK (denomination IN (5,10,20,50,100,200));

      rollback:
        # Rollback: drop new constraint and recreate the old one without 200
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              ALTER TABLE public.change_reserve_log
              DROP CONSTRAINT IF EXISTS chk_change_reserve_log_denomination;
              ALTER TABLE public.change_reserve_log
              ADD CONSTRAINT chk_change_reserve_log_denomination
              CHECK (denomination IN (5,10,20,50,100));
